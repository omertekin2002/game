<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GLB viewer</title>
<style>
  html, body { margin: 0; background: #7fb27f; font: 14px sans-serif; }
  #grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; }
  canvas { width: 100%; aspect-ratio: 1; background: #9cc79c; border-radius: 6px; }
  #info { padding: 6px 10px; color: #123; white-space: pre; }
</style>
<script type="importmap">
{ "imports": { "three": "../vendor/three/build/three.module.js", "three/addons/": "../vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="info">loading…</div>
<div id="grid"></div>
<script type="module">
// Usage: tools/viewer.html?m=path/to/model.glb  (path relative to the repo root)
// Renders the model from 4 yaw angles (0, 90, 180, 270 deg) at a 3/4 elevation.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const params = new URLSearchParams(location.search);
const url = '../' + params.get('m');
const elev = parseFloat(params.get('elev') || '20');
const grid = document.getElementById('grid');
const info = document.getElementById('info');

new GLTFLoader().load(url, (gltf) => {
  const root = gltf.scene;
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  let tris = 0;
  root.traverse((o) => { if (o.isMesh) tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
  info.textContent = `${params.get('m')}\nsize x=${size.x.toFixed(3)} y=${size.y.toFixed(3)} z=${size.z.toFixed(3)}  tris=${tris}`;
  for (const yaw of [0, 90, 180, 270]) {
    const c = document.createElement('canvas');
    c.width = c.height = 512;
    grid.appendChild(c);
    const r = new THREE.WebGLRenderer({ canvas: c, antialias: true, preserveDrawingBuffer: true });
    r.outputColorSpace = THREE.SRGBColorSpace;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9cc79c);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x667755, 2.2));
    const d = new THREE.DirectionalLight(0xffffff, 1.6); d.position.set(2, 4, 3); scene.add(d);
    const m = root.clone();
    m.position.sub(center);
    scene.add(m);
    const R = Math.max(size.x, size.y, size.z) * 1.6;
    const cam = new THREE.PerspectiveCamera(35, 1, 0.01, 100);
    const a = THREE.MathUtils.degToRad(yaw), e = THREE.MathUtils.degToRad(elev);
    cam.position.set(Math.sin(a) * Math.cos(e) * R, Math.sin(e) * R, Math.cos(a) * Math.cos(e) * R);
    cam.lookAt(0, 0, 0);
    r.render(scene, cam);
    const lbl = document.createElement('div'); lbl.textContent = 'yaw ' + yaw;
  }
  document.title = 'ready';
}, undefined, (e) => { info.textContent = 'ERROR ' + e; document.title = 'error'; });
</script>
</body>
</html>
